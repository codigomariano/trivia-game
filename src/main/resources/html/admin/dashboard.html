<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	 
  	<body>
        <div id="view-dashboard" class="view-section" layout:fragment="page-content">
	         <h2 class="mb-4" th:text="#{administracion.section.title}"></h2>
	         <div class="row g-4">
				<div sec:authorize="hasAuthority('ADMINISTRAR_USUARIOS')" class="col-md-6">
			        <div class="glass-card p-4 text-center cursor-pointer">
			            <h3 class="text-accent fs-1" th:text="${cant_usuarios}"></h3>
			            <p class="text-muted-custom mb-0" th:text="#{dashboard.total.users}"></p>
			            <a th:href="@{/web/admin/user/list}" class="btn btn-outline-light mt-3" th:text="#{view.list.btn}"></a>
			        </div>
			    </div>
			    <div sec:authorize="hasAuthority('ADMINISTRAR_PREGUNTAS')" class="col-md-6">
			        <div class="glass-card p-4 text-center cursor-pointer">
			            <h3 class="text-accent fs-1" th:text="${cant_preguntas}"></h3>
			            <p class="text-muted-custom mb-0" th:text="#{dashboard.total.questions}"></p>
			            <a th:href="@{/web/admin/pregunta/list}" class="btn btn-outline-light mt-3" th:text="#{view.list.btn}"></a>
			        </div>
			    </div>
			</div>
        </div>
	</body>
</html>
