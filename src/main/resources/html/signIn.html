<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}">
	 
	<body>
		<div id="view-registration" class="view-section" layout:fragment="page-content">
	      <div class="row justify-content-center">
	          <div class="col-md-5">
	              <div class="glass-card p-5">
	                  <h2 class="text-center mb-4" th:text="#{login.section.title}"></h2>
	                  <form id="loginFrm" th:object="${form}" th:action="@{/web/login}" method="post">
	                      <div class="mb-3">
	                          <label class="form-label text-muted-custom" th:text="#{email.field}"></label>
	                          <input id="email" th:field="*{email}" type="email" th:class="'form-control glass-input' + ${#fields.hasErrors('email') ? ' is-invalid' : ''}" placeholder="Email" required="required" th:maxlength="${form.emailMaxLength}">
	                          <div id="email-err" class="feedback invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
	                      </div>
	                      <button id="loginBtn" type="submit" class="btn btn-accent w-100 mb-3" th:text="#{login.btn}"></button>
	                      <div class="text-center">
	                          <a th:href="@{/web/signUp}" class="text-muted-custom" th:text="#{no.account}"></a>
	                      </div>
	                  </form>
	              </div>
	          </div>
	      </div>
	 	</div>	
	</body>
</html>
